name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Bundle QR library locally
        run: curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js -o app/src/main/assets/qrcode.min.js
      - name: Bundle Firebase SDK locally
        run: |
          for f in app auth firestore; do
            curl -fsSL https://www.gstatic.com/firebasejs/10.12.2/firebase-$f-compat.js -o app/src/main/assets/firebase-$f-compat.js
          done
      - name: Bundle 3D libraries locally
        run: |
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js -o app/src/main/assets/three.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js -o app/src/main/assets/GLTFLoader.js
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: YAPPER-apk
          path: app/build/outputs/apk/debug/app-debug.apk
